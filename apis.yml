aid: savee
name: Savee
description: 'Savee is a curated visual-inspiration platform for designers. Its public surface is programmatic
  two ways: a read-only REST API — an OpenAPI 3.1 contract of 10 GET operations and 12 schemas served
  live from api.savee.com/v1/openapi.json, authenticated with a personal access token or OAuth 2.1 — and
  an official hosted MCP server at mcp.savee.com/mcp with twelve tools (eight read, four opt-in write)
  behind spec-conformant OAuth 2.1 with PKCE. Both require an active Savee subscription.'
