source: https://docs.savee.com/api/versioning
versioning:
  scheme: path
  current: v1
  policy: >-
    The version lives in the path; a /v2/ would be a separate surface served alongside /v1/
    rather than replacing it. Within v1: fields are never removed or retyped, error.code
    values are contract, ids are stable across renames, and paths/methods never move. Additive
    change is allowed without notice: new fields, new endpoints, cursor encoding, error
    message wording, in-page ordering, and rate-limit values (raised before lowered, with the
    current values always in the response headers).
  client_guidance: >-
    Parse permissively, treat cursors as opaque, read limits from headers, and point code
    generators at the live /v1/openapi.json (generated from the same schemas that serialize
    responses, so it cannot drift).
deprecation:
  policy_published: false
  sunset_headers: false
  note: >-
    No deprecation policy, Deprecation/Sunset (RFC 8594) headers, or dated deprecation
    process is published — v1 is the first and only version and nothing has been deprecated.
    The versioning page's stability guarantees are the nearest thing to one.
